name: tests

on:
  # Modèle de branches d'AGENTS.md §1 : main, dev et les branches de travail.
  push:
    branches: [main, dev, "feat/**", "fix/**", "chore/**"]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows : poste réel des utilisateurs. Ubuntu : contrôle croisé.
        os: [windows-latest, ubuntu-latest]
        # 3.11 : plancher de requires-python (pyproject.toml). 3.12 : version du poste.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer le paquet et les outils de test
        run: python -m pip install -e ".[dev]"
      - name: Lancer la banque de tests
        # Le rendu PDF (T-FMT-07b) est sauté si LibreOffice est absent du runner.
        run: python -m pytest
