[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facturation-auto"
version = "0.2.0.dev0"
description = "Factures mensuelles d'un formateur indépendant à partir de son agenda de cours"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Propriétaire — tous droits réservés" }
authors = [{ name = "Adrian Rosari" }]
dependencies = [
    # Épinglé en 3.1.x : le clonage du gabarit s'appuie sur une structure interne
    # d'openpyxl (pcf_format._recopier_cellules). Avant de relever la borne, lancer
    # tests/unit/test_clonage.py, qui vérifie ce contrat.
    "openpyxl>=3.1,<3.2",
    # Lecture de l'agenda iCal (F-10) : développement des récurrences, exceptions,
    # occurrences déplacées et changements d'heure.
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
    # Windows n'a pas de base de fuseaux horaires : zoneinfo s'appuie sur tzdata.
    "tzdata; sys_platform == 'win32'",
    # Sans Pillow, openpyxl abandonne sans prévenir les images (logo) d'un classeur qu'il
    # réenregistre (constat des classeurs d'école, contrats des vagues 3 à 5, § 17).
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
facturation = "facturation.cli:main"

[tool.setuptools]
packages = ["facturation", "facturation.commandes"]

[tool.setuptools.package-data]
facturation = ["assets/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true
markers = [
    "unit: fonctions pures, sans fichier externe",
    "integration: plusieurs modules ou scripts, sur données fictives",
    "regression: non-régression du format et du rendu des factures",
    "recette: parcours complet d'une facture, vérifié sur le fichier relu depuis le disque",
    "e2e: parcours dans l'appli avec Playwright (lot 2)",
]
