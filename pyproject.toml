[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facturation-auto"
version = "0.2.0.dev0"
description = "Factures mensuelles d'un formateur indépendant à partir de son agenda de cours"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Propriétaire — tous droits réservés" }
authors = [{ name = "Adrian Rosari" }]
dependencies = [
    "openpyxl>=3.1",
    # Windows n'a pas de base de fuseaux horaires : zoneinfo s'appuie sur tzdata.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
facturation = "facturation.cli:main"

[tool.setuptools]
packages = ["facturation"]

[tool.setuptools.package-data]
facturation = ["assets/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true
markers = [
    "unit: fonctions pures, sans fichier externe",
    "integration: plusieurs modules ou scripts, sur données fictives",
    "regression: non-régression du format et du rendu des factures",
    "e2e: parcours dans l'appli avec Playwright (lot 2)",
]
